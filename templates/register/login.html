<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
</head>
<body>
{% if form.error %}
    <p>Неверный логин или пароль</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div>
        {{ form.username.label_tag }}
        {{ form.username }}
        {{ form.username.error }}
    </div>
    <div>
        {{ form.password.label_tag }}
        {{ form.password }}
        {{ form.password.error }}
    </div>
    <div>
        {{ form.remember_me }}
        {{ form.remember_me.label_tag }}
    </div>
    <button type="submit">Войти</button>
</form>
<a href="{% url 'notes:register' %}">
    <button>Зарегистрироваться</button>
</a>
</body>
</html>
