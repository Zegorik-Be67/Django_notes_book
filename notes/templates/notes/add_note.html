<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Добавить запись</title>
</head>
<body>
<h2>Добавить запись</h2>
<form method="post">
    {% csrf_token %}
    <p>Запись: {{ form.note }}</p>
    <p>Теги:</p>
    <input type="text" name="new_tag" placeholder="Новый тег">
    <button type="submit" name="add_tag">Добавить</button>
    <p>{{ form.tags }}</p>
    <button type="submit" >Добавить запись</button>
</form>
<a href="{% url 'notes:home' %}">
    <button>Вернуться</button>
</a>
</body>
</html>
